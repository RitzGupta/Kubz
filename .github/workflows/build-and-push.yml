name: Build and push to ECR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: kubz
  AWS_ROLE_ARN: arn:aws:iam::147956724891:role/github-actions-kubz-ecr-push

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$ECR_REPOSITORY:${{ github.sha }}" .

      # PRs only build, to verify the Dockerfile - no AWS creds, nothing pushed.
      - name: Configure AWS credentials
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name != 'pull_request'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The ECR repo has immutable tags, so a commit can only be pushed once.
      # Re-running a build on an unchanged commit is normal (manual dispatch,
      # re-run failed job), so treat an already-present image as success.
      - name: Tag and push
        if: github.event_name != 'pull_request'
        run: |
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          SHA="${{ github.sha }}"

          # batch-get-image, not describe-images: the CI role is only granted
          # ecr:BatchGetImage. It exits 0 either way, so compare the output.
          FOUND=$(aws ecr batch-get-image \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids imageTag="$SHA" \
                    --region "$AWS_REGION" \
                    --query 'images[0].imageId.imageTag' \
                    --output text 2>/dev/null || true)

          if [ "$FOUND" = "$SHA" ]; then
            echo "$IMAGE:$SHA is already in ECR - nothing to push"
            exit 0
          fi

          docker tag "$ECR_REPOSITORY:$SHA" "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA"
          echo "pushed $IMAGE:$SHA"
